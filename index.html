<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tune your instrument and recognise chords from your microphone. Runs entirely in your browser."
    />
    <title>pitchpipe — tuner and chord detector</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>pitchpipe</h1>
        <p class="lede">
          A tuner and chord detector that listens through your microphone. Audio
          is analysed on your device and never uploaded.
        </p>
      </header>
      <section id="tuner" aria-live="polite">
        <div class="controls">
          <label
            >Instrument
            <select id="preset"></select>
          </label>
          <label
            >A4 (Hz)
            <input
              id="a4"
              type="number"
              min="415"
              max="466"
              step="1"
              value="440"
            />
          </label>
        </div>
        <p id="note" class="note">–</p>
        <div
          id="gauge"
          class="gauge"
          role="meter"
          aria-label="Tuning offset in cents"
          aria-valuemin="-50"
          aria-valuemax="50"
          aria-valuenow="0"
        >
          <span class="tick"></span>
          <span id="needle" class="needle"></span>
        </div>
        <p id="target" class="detail"></p>
        <p id="detail" class="detail">Press start and play a single note.</p>
        <button id="toggle" type="button">Start listening</button>
        <p id="error" class="error" role="alert" hidden></p>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
